[package]
name = "open-engine-backend"
version.workspace = true
edition.workspace = true
description = "Open Engine Lib backend: the library process, which reads the Engine library, and the audio process, which plays tracks, both for the UI over gRPC"

# The UI starts both. The library process has no audio code and the audio process no
# SQLite, so each links only what it uses.
[[bin]]
name = "open-engine-backend"
path = "src/main.rs"

[[bin]]
name = "open-engine-audio"
path = "src/audio/main.rs"

# `analysis` is the analysis of a track by the audio process (beats with Beat This!, key with
# libKeyFinder, which has to be installed: pkg-config must find `libkeyfinder`). Without it the
# audio process says so when asked, and everything else works.
[features]
default = ["analysis"]
analysis = ["dep:beat-this", "dep:libkeyfinder-sys"]

[dependencies]
beat-this = { version = "1.1.0", default-features = false, optional = true }
crc32fast = "1.5.2"
dirs = "7.0.0"
flate2 = "1.1.10"
getrandom = "0.4.3"
libkeyfinder-sys = { version = "0.1.0", optional = true }
lofty = "0.25.4"
open-engine-api = { path = "../api" }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-stream = "0.1.19"
toml = "1.1.8"
tonic = "0.14.6"

# The audio process listens to MIDI controllers through the ALSA sequencer (`src/audio/midi.rs`).
[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.11.0"
