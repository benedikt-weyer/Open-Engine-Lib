[package]
name = "open-engine-backend"
version.workspace = true
edition.workspace = true
description = "Open Engine Lib backend: reads the Engine library and plays tracks for the UI over gRPC"

[dependencies]
dirs = "7.0.0"
open-engine-api = { version = "0.1.0", path = "../api" }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-stream = "0.1.19"
tonic = "0.14.6"
