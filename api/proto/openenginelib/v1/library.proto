// Opening an Engine library and reading its tracks and playlists. The backend
// holds at most one open library; opening another replaces it.
syntax = "proto3";

package openenginelib.v1;

service LibraryService {
  // Opens the library at `path`, closing the current one (and stopping playback).
  // The backend never works on the library in place: it copies the databases into
  // its cache and reads those. The audio files stay where they are and are played
  // from there.
  // Errors: NOT_FOUND if no Engine library is there, INTERNAL if it can't be read.
  rpc OpenLibrary(OpenLibraryRequest) returns (OpenLibraryResponse);
  // Saves the open library to a new place and makes that its location from now on: the
  // old location is no longer used. The working copy of the databases is cloned into a
  // new `Engine Library` folder there (created inside `path`, unless `path` is itself
  // called `Engine Library`), the audio files stay where they are, and the track paths in
  // the clone are rewritten to lead to the same files from the new place. The covers that
  // are files (`Artwork`) are copied too; the stems and overview data are not. Playback
  // goes on undisturbed, and track and playlist ids stay the same, but the tracks' `path`
  // changes (list the tracks again to see it). If anything fails nothing is left behind and
  // the library keeps its old location.
  // Errors: FAILED_PRECONDITION if no library is open, INVALID_ARGUMENT if `path` is the
  // library's current location, ALREADY_EXISTS if there already is a library at `path`,
  // INTERNAL if copying fails.
  rpc SaveLibraryAs(SaveLibraryAsRequest) returns (SaveLibraryAsResponse);
  // What would change in the source (the library at its location, as opposed to the
  // working copy the backend reads and could change) if the working copy were written to
  // it: the differences between the two. Nothing is changed.
  // Error: FAILED_PRECONDITION if no library is open.
  rpc GetSyncDiff(GetSyncDiffRequest) returns (GetSyncDiffResponse);
  // Writes the working copy's databases to the source, replacing the ones there. The
  // previous ones are first copied to `Database2/open-engine-lib-backup` in the source
  // (replacing an older backup), each file is replaced in one step, and if one fails the
  // ones already replaced are put back.
  // Errors: FAILED_PRECONDITION if no library is open, the source can't be reached (a
  // drive that is gone), is in use (a journal that has not been committed), or has been
  // changed by someone else since the working copy was made and
  // `overwrite_outside_changes` is not set; INTERNAL if writing fails.
  rpc SyncToSource(SyncToSourceRequest) returns (SyncToSourceResponse);
  // Replaces the working copy by the library at its source (the reverse of
  // `SyncToSource`): edits that were not synced are kept in `unsynced-edits` in the cache
  // folder. The library that is open is replaced by one read from the new working copy,
  // so track and playlist ids must be fetched again (tracks only get new ids if the source
  // has other tracks).
  // Errors: FAILED_PRECONDITION if no library is open, the source can't be reached or is in
  // use; INTERNAL if copying fails.
  rpc PullFromSource(PullFromSourceRequest) returns (PullFromSourceResponse);
  // Sets a track's star rating in the working copy. The source is not touched until
  // `SyncToSource`, and `ListTracks` answers with the new rating from now on.
  // Errors: FAILED_PRECONDITION if no library is open, INVALID_ARGUMENT for a rating
  // above 100, NOT_FOUND for an unknown track id, INTERNAL if the database can't be
  // written.
  rpc SetRating(SetRatingRequest) returns (SetRatingResponse);
  // Adds a smart playlist to the working copy, at the top level after the smart
  // playlists that are there. Playlist ids after it change: the answer has the new list
  // of playlists. The source is not touched until `SyncToSource`.
  // Errors: FAILED_PRECONDITION if no library is open or it has no smart playlists
  // (too old), INVALID_ARGUMENT for an empty title or rules that are not valid,
  // ALREADY_EXISTS if a top-level playlist has the title, INTERNAL if the database can't
  // be written.
  rpc CreateSmartPlaylist(CreateSmartPlaylistRequest) returns (SmartPlaylistEdited);
  // Changes the title and rules of a smart playlist in the working copy. Errors as for
  // `CreateSmartPlaylist`, and NOT_FOUND for an unknown playlist id, INVALID_ARGUMENT
  // too if the playlist is not a smart one.
  rpc UpdateSmartPlaylist(UpdateSmartPlaylistRequest) returns (SmartPlaylistEdited);
  // Adds an empty playlist to the working copy, at the end of the playlists of
  // `parent_id` or of the top level. Playlist ids after it change: the answer has the
  // new list of playlists and the id of the new one.
  // Errors: FAILED_PRECONDITION if no library is open, INVALID_ARGUMENT for an empty
  // title or a parent that is a smart playlist, NOT_FOUND for an unknown parent,
  // ALREADY_EXISTS if the parent has a playlist with the title, INTERNAL if the
  // database can't be written.
  rpc CreatePlaylist(CreatePlaylistRequest) returns (PlaylistsEdited);
  // Changes the title of a playlist in the working copy. Errors as for `CreatePlaylist`,
  // and INVALID_ARGUMENT for a smart playlist (see `UpdateSmartPlaylist`).
  rpc RenamePlaylist(RenamePlaylistRequest) returns (PlaylistsEdited);
  // Deletes a playlist from the working copy, with the playlists and smart playlists
  // in it. Its tracks stay in the library. Playlist ids after it change. Errors as for
  // `RenamePlaylist`.
  rpc DeletePlaylist(DeletePlaylistRequest) returns (PlaylistsEdited);
  // Saves the location of each track's file as its origin in Open Engine Lib's own
  // database, for the tracks that have no origin saved yet (one that is saved is kept).
  // Tracks without a file here (streaming) or that don't say where they came from are
  // skipped. Nothing in the Engine library changes.
  // Errors: FAILED_PRECONDITION if no library is open, INTERNAL if the database can't
  // be opened or written.
  rpc MigrateOrigins(MigrateOriginsRequest) returns (MigrateOriginsResponse);
  // What making the playlists and smart playlists of another library the same as the
  // open one's would change. The tracks of a playlist are matched by where they came
  // from (`originDatabaseUuid` and `originTrackId`), else by a file name that only one
  // track of each library has. Tracks and audio files are never copied: tracks the other
  // library lacks are left out of its playlists and counted. Nothing is written.
  // Errors: FAILED_PRECONDITION if no library is open or the other library is being
  // written to by another program, NOT_FOUND if the path has no Engine library,
  // INVALID_ARGUMENT if it is the open library, INTERNAL if reading fails.
  rpc GetLibrarySyncDiff(GetLibrarySyncDiffRequest) returns (GetLibrarySyncDiffResponse);
  // Does what `GetLibrarySyncDiff` lists: the other library's `m.db` is replaced by one
  // with the changes, after the old one was kept in `open-engine-lib-backup` next to it.
  // Errors as for `GetLibrarySyncDiff`.
  rpc SyncToLibrary(SyncToLibraryRequest) returns (SyncToLibraryResponse);
  // How far the sync that is running (`SyncToSource`, `SyncToLibrary`) has got, to be
  // asked again and again while it runs. Not running: `running` is false and the rest is
  // empty. Does not need a library to be open.
  rpc GetProgress(GetProgressRequest) returns (OperationProgress);
  // Closes the library and stops playback. Succeeds if none is open.
  rpc CloseLibrary(CloseLibraryRequest) returns (CloseLibraryResponse);
  // Streams every track of the open library in id order, in batches.
  // Error: FAILED_PRECONDITION if no library is open.
  rpc ListTracks(ListTracksRequest) returns (stream TrackBatch);
  // All playlists, depth first in display order, each with its tracks.
  // Error: FAILED_PRECONDITION if no library is open.
  rpc ListPlaylists(ListPlaylistsRequest) returns (ListPlaylistsResponse);
  // The cover image with the given `Track.album_art_id`.
  // Errors: FAILED_PRECONDITION if no library is open, NOT_FOUND if the id is unknown
  // or its image is not available on this machine (e.g. covers of streaming tracks).
  rpc GetAlbumArt(GetAlbumArtRequest) returns (GetAlbumArtResponse);
  // The waveform of a track, for drawing it, and its beatgrid if the library has one.
  // The waveform is computed from the audio file, so this takes a moment the first
  // time for a track (the backend remembers recent ones).
  // Errors: FAILED_PRECONDITION if no library is open or the track is a streaming
  // track, INVALID_ARGUMENT for an unknown track id, NOT_FOUND if the audio file does
  // not exist, INTERNAL if it can't be decoded.
  rpc GetWaveform(GetWaveformRequest) returns (GetWaveformResponse);
  // The cues (hot cues) of a track, in slot order. A track without any, or that has not
  // been analysed, has an empty list.
  // Errors: FAILED_PRECONDITION if no library is open, NOT_FOUND for an unknown track
  // id, INTERNAL if the database can't be read.
  rpc GetCues(GetCuesRequest) returns (CuesResponse);
  // Replaces the cues of a track in the working copy: the slots in the request are the
  // ones the track has afterwards, all other slots are emptied. (To add, change or remove
  // a cue, send the list from `GetCues` with that change.) The source is not touched until
  // `SyncToSource`, and `ListTracks` answers with the new `cue_count` from now on. The
  // answer is the cues as they are now.
  // Errors: FAILED_PRECONDITION if no library is open or the track has no analysis to keep
  // cues in (it has not been analysed), NOT_FOUND for an unknown track id,
  // INVALID_ARGUMENT for a slot that is 8 or more or is given twice, a position that is
  // negative, not a number or after the end of the track, or a label of more than 255
  // bytes, INTERNAL if the database can't be written.
  rpc SetCues(SetCuesRequest) returns (CuesResponse);
  // The saved loops of a track, in slot order. A track without any, or that has not been
  // analysed, has an empty list. Errors as for `GetCues`.
  rpc GetLoops(GetLoopsRequest) returns (LoopsResponse);
  // Replaces the saved loops of a track in the working copy: the slots in the request are
  // the ones the track has afterwards, and the loops that were in other slots are removed
  // (a slot that is only half set is left alone). The source is not touched until
  // `SyncToSource`, and `ListTracks` answers with the new `loop_count` from now on. The
  // answer is the loops as they are now.
  // Errors: as for `SetCues`, with INVALID_ARGUMENT also for a loop whose end is not after
  // its start.
  rpc SetLoops(SetLoopsRequest) returns (LoopsResponse);
}

message OpenLibraryRequest {
  // The `Engine Library` folder, the drive or folder that contains it, or its
  // `Database2` folder.
  string path = 1;
}

message OpenLibraryResponse {
  // The `Engine Library` folder that was actually opened.
  string path = 1;
  uint32 track_count = 2;
  uint32 playlist_count = 3;
  // The backend's cached copy of the databases, which is what it reads.
  string cache_path = 4;
}

message SaveLibraryAsRequest {
  // The folder to save into, or the `Engine Library` folder to make.
  string path = 1;
}

message SaveLibraryAsResponse {
  // The `Engine Library` folder that was made, the library's location now.
  string path = 1;
  // The backend's cached copy of the databases, which is what it reads now.
  string cache_path = 2;
}

message SetRatingRequest {
  // `Track.id`.
  uint32 track_id = 1;
  // From 0 (no stars) to 100 (five), 20 per star.
  uint32 rating = 2;
}
message SetRatingResponse {}

message CreateSmartPlaylistRequest {
  string title = 1;
  SmartRules rules = 2;
}
message UpdateSmartPlaylistRequest {
  // `Playlist.id` of a smart playlist.
  uint32 playlist_id = 1;
  string title = 2;
  SmartRules rules = 3;
}
message SmartPlaylistEdited {
  // The playlist that was added or changed, in `playlists`. (A new title can move it.)
  uint32 playlist_id = 1;
  // All playlists as `ListPlaylists` answers now.
  repeated Playlist playlists = 2;
}

message CreatePlaylistRequest {
  string title = 1;
  // `Playlist.id` of the playlist to put it in; unset for the top level.
  optional uint32 parent_id = 2;
}
message RenamePlaylistRequest {
  uint32 playlist_id = 1;
  string title = 2;
}
message DeletePlaylistRequest {
  uint32 playlist_id = 1;
}
message PlaylistsEdited {
  // The playlist that was added; unset after a rename or a delete.
  optional uint32 playlist_id = 1;
  // All playlists as `ListPlaylists` answers now.
  repeated Playlist playlists = 2;
}

message MigrateOriginsRequest {}
message MigrateOriginsResponse {
  // Origins that were new.
  uint32 saved = 1;
  // Tracks that already had an origin, which was kept.
  uint32 kept = 2;
  // Tracks left out: streaming ones and ones that don't say where they came from.
  uint32 skipped = 3;
  // The origin of every track of the library that has one now, new or not.
  repeated TrackOrigin origins = 4;
}
message TrackOrigin {
  // `Track.id`.
  uint32 track_id = 1;
  string origin = 2;
}

message GetLibrarySyncDiffRequest {
  // The other library's `Engine Library` folder, the folder or drive that contains it, or
  // its `Database2` folder.
  string target_path = 1;
  // Also delete playlists and smart playlists that only the other library has.
  bool remove_missing = 2;
  // The other library's star ratings become those of the open library, for the tracks
  // both have.
  bool sync_stars = 3;
  // The other library's track paths become the open library's, as written (so they
  // only lead to the files if both libraries are laid out the same).
  bool sync_locations = 4;
  // The audio files of the open library's tracks are copied to an `Engine-Tracks` folder
  // beside the other library's `Engine Library` folder, as `Artist/Album/File` with names
  // that exFAT accepts, and the tracks' paths there lead to the copies. Tracks the other
  // library lacks are added to it. Replaces `sync_locations`.
  bool copy_tracks = 5;
  // The other way round: the other library is the master and the open library's working
  // copy gets what is different (playlists, stars, locations, tracks, origins), as a
  // change to be synced to the open library's source afterwards. The files of copied
  // tracks go to `Engine-Tracks` beside the open library's `Engine Library` folder. The
  // fields of the response then describe the open library's changes. After a change the
  // open library is replaced by one read from the new working copy, as with
  // `PullFromSource`.
  bool reverse = 6;
  // If there is no library at `target_path`, make one there (a new `Engine Library` folder
  // in it, unless it is called that): the diff then says so (`target_is_new`) and
  // changes nothing; `SyncToLibrary` makes it, with the schema of the open library's
  // databases and no rows, and then syncs as usual. Not for `reverse`, which needs a
  // library to copy from (NOT_FOUND). Without this, no library there is NOT_FOUND.
  bool create_if_missing = 7;
}
// Lists are cut at 200 entries, the counts are complete.
message GetLibrarySyncDiffResponse {
  // The other library's `Engine Library` folder.
  string target_path = 1;
  uint32 playlists_changed = 2;
  repeated PlaylistChange changed_playlists = 3;
  // Tracks of the open library, in the playlists, that the other library does not have.
  uint32 tracks_missing = 4;
  repeated TrackRef missing_tracks = 5;
  // Tracks of the other library whose saved origin is new or different from the open
  // library's, which replaces it.
  uint32 origins_changed = 6;
  // Tracks that would be added to the other library (`copy_tracks`).
  uint32 tracks_added = 7;
  repeated TrackRef added_tracks = 8;
  // Tracks of the other library that would change (stars, path); in the fields of a
  // change `source_value` is what the other library has and `working_value` what it gets.
  uint32 tracks_changed = 9;
  repeated TrackChange changed_tracks = 10;
  // Files that would be copied, and their size.
  uint32 files_to_copy = 11;
  uint64 bytes_to_copy = 12;
  // Tracks of the open library whose file could not be found, so it is not copied.
  uint32 files_missing = 13;
  // Tracks whose new path another track of the other library already has: left alone.
  uint32 location_conflicts = 14;
  // There is no library at the path: a new one would be created at `target_path`.
  bool target_is_new = 15;
}
message SyncToLibraryRequest {
  string target_path = 1;
  bool remove_missing = 2;
  bool sync_stars = 3;
  bool sync_locations = 4;
  bool copy_tracks = 5;
  // As for `GetLibrarySyncDiffRequest`.
  bool reverse = 6;
  bool create_if_missing = 7;
}
message SyncToLibraryResponse {
  string target_path = 1;
  uint32 playlists_changed = 2;
  uint32 tracks_missing = 3;
  // Where the replaced database was kept; empty if nothing needed to be written.
  string backup_path = 4;
  uint32 origins_changed = 5;
  uint32 tracks_added = 6;
  uint32 tracks_changed = 7;
  uint32 files_copied = 8;
  // The library did not exist and was made.
  bool created = 9;
}

message PullFromSourceRequest {}
message PullFromSourceResponse {
  uint32 files_written = 1;
  // Where the edits that had not been synced were kept; empty if there were none.
  string kept_edits_path = 2;
}

message GetProgressRequest {}

message OperationProgress {
  bool running = 1;
  ProgressPhase phase = 2;
  // In the current phase: bytes copied and to copy. Both 0 for a phase that copies none.
  uint64 done_bytes = 3;
  uint64 total_bytes = 4;
  // Of the audio files of the phase.
  uint32 done_files = 5;
  uint32 total_files = 6;
  // The file that is being copied.
  string current = 7;
}

enum ProgressPhase {
  PROGRESS_PHASE_UNSPECIFIED = 0;
  // Making a copy of the other library's database to work on.
  PROGRESS_PHASE_PREPARING = 1;
  PROGRESS_PHASE_COPYING_TRACKS = 2;
  // Changing the tracks, playlists and origins in that copy.
  PROGRESS_PHASE_UPDATING = 3;
  // Keeping the old databases and putting the new ones in place.
  PROGRESS_PHASE_WRITING = 4;
  // Copying the source's databases into the working copy (`PullFromSource`).
  PROGRESS_PHASE_PULLING = 5;
}

message CloseLibraryRequest {}
message CloseLibraryResponse {}

message ListTracksRequest {}

message TrackBatch {
  repeated Track tracks = 1;
}

message Track {
  // Identifies the track while this library is open. Ids are not stable across
  // opens and say nothing about the Engine database's own ids.
  uint32 id = 1;
  string title = 2;
  string artist = 3;
  string album = 4;
  string genre = 5;
  // Analysed tempo, unset if unknown.
  optional double bpm = 6;
  optional uint32 length_seconds = 7;
  // Streaming tracks (e.g. TIDAL) have no file on this machine and can't be played.
  bool streaming = 8;
  // Which cover the track has, for GetAlbumArt. Tracks that share a cover (an album)
  // share the id. Unset if the track has none. The image may still turn out not to be
  // available, see GetAlbumArt.
  optional uint32 album_art_id = 9;
  // The track's star rating from 0 to 100, 20 per star (so 60 is three stars). Other
  // values are possible: libraries that were imported can have any.
  optional uint32 rating = 11;
  // What SoundSwitch (the lighting software, which keeps projects in the drive's
  // `SoundSwitch` folder) has for the track. Not set if there is no SoundSwitch data for
  // the drive or the track is not in it.
  SoundSwitchState soundswitch = 12;
  // The SoundSwitch projects that have lighting for the track, when it is rendered.
  repeated string soundswitch_projects = 13;
  // The audio file as the library records it, relative to the `Engine Library`
  // folder. Unlike `id`, it stays the same across opens, so it identifies the track
  // between sessions (the library keeps it unique).
  string path = 10;
  // Where the track's file was when its origin was saved (`MigrateOrigins`), kept in
  // Open Engine Lib's own database and shared by all libraries the track is in. Not set
  // if none was saved.
  optional string origin = 14;
  // How many cue slots the track has set, as of now (`SetCues` changes it).
  uint32 cue_count = 15;
  // How many loop slots the track has saved, as of now (`SetLoops` changes it).
  uint32 loop_count = 16;
}

enum SoundSwitchState {
  // Not in SoundSwitch, or there is no SoundSwitch data to tell.
  SOUND_SWITCH_STATE_UNSPECIFIED = 0;
  // SoundSwitch analysed the track but has no lighting for it.
  SOUND_SWITCH_STATE_ANALYSED = 1;
  // Lighting was rendered for the track.
  SOUND_SWITCH_STATE_RENDERED = 2;
}

message GetAlbumArtRequest {
  uint32 id = 1;
}

message GetAlbumArtResponse {
  // The encoded image file.
  bytes data = 1;
  // `image/png` or `image/jpeg`.
  string mime_type = 2;
}

message ListPlaylistsRequest {}

message ListPlaylistsResponse {
  repeated Playlist playlists = 1;
}

message Playlist {
  // Identifies the playlist while this library is open.
  uint32 id = 1;
  string title = 2;
  // 0 for top-level playlists.
  uint32 depth = 3;
  optional uint32 parent_id = 4;
  // True for folders; they can hold tracks too.
  bool has_children = 5;
  // Track ids in playlist order.
  repeated uint32 track_ids = 6;
  // True for a smart playlist: `track_ids` are the tracks that satisfy its rules.
  bool is_smart = 7;
  // The rules of a smart playlist, if they could be read.
  optional SmartRules rules = 8;
}

// What a smart playlist holds: the tracks that satisfy all (or any) of the rules.
message SmartRules {
  // All rules must match; false means any one.
  bool match_all = 1;
  repeated SmartRule rules = 2;
}

message SmartRule {
  // A track field: `title`, `artist`, `album`, `genre` or `bpm` are understood. Others
  // are kept as they are and match no track.
  string column = 1;
  // An SQL comparison: `LIKE`, `NOT LIKE`, `=`, `!=`, `<>`, and for `bpm` also `<`,
  // `<=`, `>`, `>=`.
  string condition = 2;
  // The value as plain text (no SQL quotes). For `LIKE`, `%` stands for any run of
  // characters and `_` for one. For `bpm` it must be a number.
  string param = 3;
}

message GetWaveformRequest {
  uint32 track_id = 1;
  // Where the low, mid and high bands meet, in Hz: the low band is below `low_mid_hz`,
  // the high band above `mid_high_hz`, the mid band in between. Unset means 600 Hz and
  // 4000 Hz. Both must be between 20 and 20000 and the first below the second, else
  // INVALID_ARGUMENT. (A file with a low sample rate can't hold the high ones; they are
  // lowered for it.)
  optional uint32 low_mid_hz = 2;
  optional uint32 mid_high_hz = 3;
  // How much each band is amplified before it is drawn, see `GetWaveformResponse.columns`.
  // Unset means 1. Each must be above 0 and at most 20, else INVALID_ARGUMENT.
  optional float gain_low = 4;
  optional float gain_mid = 5;
  optional float gain_high = 6;
}

message GetWaveformResponse {
  double duration_seconds = 1;
  // How many columns make up a second of the track (100: one per 10 ms).
  uint32 columns_per_second = 2;
  // Three bytes per column, in time order: the height to draw the low, the mid and the
  // high frequencies at, from 0 (nothing) to 255 (full height). A band's height is its
  // loudest sample in the 10 ms (as a share of full scale: a full-scale sine wave in the
  // band is 1) times the gain of the band, but at most 1, to the power of 0.8, times
  // 255. The scale is fixed, the same for every track: it is not fitted to how loud the
  // track is or to how much of each band it has.
  bytes columns = 3;
  // Unset if the library has no beatgrid for the track.
  optional BeatGrid beat_grid = 4;
}

// The library's analysis of where the beats are. Between two markers the beats are
// evenly spaced; before the first and after the last they continue at the spacing of
// the nearest pair.
message BeatGrid {
  // At least two, in time order.
  repeated BeatMarker markers = 1;
}

message BeatMarker {
  // May be negative: the grid can start before the track does.
  double position_seconds = 1;
  // Counts beats, and can be negative. A beat whose number is a multiple of 4 starts a bar.
  int64 beat_number = 2;
}

message GetCuesRequest {
  uint32 track_id = 1;
}

message SetCuesRequest {
  uint32 track_id = 1;
  repeated Cue cues = 2;
}

message CuesResponse {
  // In slot order.
  repeated Cue cues = 1;
}

// A cue point of a track: one of the eight pads of Engine's hot cues.
message Cue {
  // The pad, from 0 to 7 (Engine shows them as 1 to 8).
  uint32 slot = 1;
  string label = 2;
  // Where the cue is, in seconds from the start of the track.
  double position_seconds = 3;
  // The color as 0xAARRGGBB.
  uint32 color_argb = 4;
}

message GetLoopsRequest {
  uint32 track_id = 1;
}

message SetLoopsRequest {
  uint32 track_id = 1;
  repeated Loop loops = 2;
}

message LoopsResponse {
  // In slot order.
  repeated Loop loops = 1;
}

// A saved loop of a track: one of the eight loop pads.
message Loop {
  // The pad, from 0 to 7 (Engine shows them as 1 to 8).
  uint32 slot = 1;
  string label = 2;
  // Where the loop starts and ends, in seconds from the start of the track.
  double start_seconds = 3;
  double end_seconds = 4;
  // The color as 0xAARRGGBB.
  uint32 color_argb = 5;
}

message GetSyncDiffRequest {
  // The other way round: what would change in the working copy if it were replaced by the
  // source (`PullFromSource`). Then "added" is in the source and not in the working copy,
  // and in a change `source_value` is the working copy's value and `working_value` the
  // source's, i.e. what the working copy would get.
  bool reverse = 1;
}

// What syncing would do to the source. "Added" is in the working copy and not in the
// source, so syncing adds it there; "removed" is in the source and not in the working
// copy, so syncing removes it from the source. Lists are cut at 200 entries, the counts
// are complete.
message GetSyncDiffResponse {
  string source_path = 1;
  string cache_path = 2;
  // False if the source can't be reached (say its drive is not connected); then nothing
  // else is filled in.
  bool source_available = 3;
  // The source has an uncommitted journal: another program is writing to it right now.
  bool source_busy = 4;
  // The source's databases were changed by someone else after the working copy was made
  // from them, so syncing would also undo their changes.
  bool source_changed_outside = 5;
  // The database files (`m.db`, `hm.db`, ...) whose content differs. Syncing writes
  // exactly these. They can differ in ways that are not itemised below (the history, ...).
  repeated string changed_databases = 6;
  uint32 tracks_added = 7;
  uint32 tracks_removed = 8;
  uint32 tracks_changed = 9;
  repeated TrackRef added_tracks = 10;
  repeated TrackRef removed_tracks = 11;
  repeated TrackChange changed_tracks = 12;
  uint32 playlists_changed = 13;
  repeated PlaylistChange changed_playlists = 14;
  // Tracks whose saved origin is new or different in the working copy
  // (`open-engine-lib.db`, which is written like the other databases).
  uint32 origins_changed = 15;
}

message TrackRef {
  string title = 1;
  string artist = 2;
  string path = 3;
}

message TrackChange {
  TrackRef track = 1;
  repeated FieldChange fields = 2;
}

message FieldChange {
  string field = 1;
  // The value in the source, and what it would become. Empty for none; binary data
  // (beatgrid, cues, loops) is shown as "(changed)".
  string source_value = 2;
  string working_value = 3;
}

message PlaylistChange {
  // The playlist as a path of titles, e.g. "House / Deep".
  string name = 1;
  PlaylistChangeKind kind = 2;
  // For a rename, the old name; for a move, the old parent.
  string detail = 3;
  uint32 tracks_added = 4;
  uint32 tracks_removed = 5;
  bool order_changed = 6;
  // A smart playlist (then there are no tracks to count).
  bool smart = 7;
  // The rules of a smart playlist differ, whatever `kind` is.
  bool rules_changed = 8;
  // Only when syncing to another library: tracks of the playlist that the other library
  // does not have and that are left out.
  uint32 tracks_missing = 9;
}

enum PlaylistChangeKind {
  PLAYLIST_CHANGE_KIND_UNSPECIFIED = 0;
  PLAYLIST_CHANGE_KIND_ADDED = 1;
  PLAYLIST_CHANGE_KIND_REMOVED = 2;
  PLAYLIST_CHANGE_KIND_RENAMED = 3;
  PLAYLIST_CHANGE_KIND_MOVED = 4;
  // Only its tracks changed.
  PLAYLIST_CHANGE_KIND_TRACKS = 5;
  // Only the rules of a smart playlist changed.
  PLAYLIST_CHANGE_KIND_RULES = 6;
}

message SyncToSourceRequest {
  // Go ahead although the source was changed by someone else since the working copy was
  // made, undoing those changes.
  bool overwrite_outside_changes = 1;
}

message SyncToSourceResponse {
  uint32 files_written = 1;
  // Where the databases that were replaced were kept.
  string backup_path = 2;
}
