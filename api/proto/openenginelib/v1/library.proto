// Opening an Engine library and reading its tracks and playlists. The backend
// holds at most one open library; opening another replaces it.
syntax = "proto3";

package openenginelib.v1;

service LibraryService {
  // Opens the library at `path`, closing the current one (and stopping playback).
  // The backend never works on the library in place: it copies the databases into
  // its cache and reads those. The audio files stay where they are and are played
  // from there.
  // Errors: NOT_FOUND if no Engine library is there, INTERNAL if it can't be read.
  rpc OpenLibrary(OpenLibraryRequest) returns (OpenLibraryResponse);
  // Saves the open library to a new place and makes that its location from now on: the
  // old location is no longer used. The working copy of the databases is cloned into a
  // new `Engine Library` folder there (created inside `path`, unless `path` is itself
  // called `Engine Library`), the audio files stay where they are, and the track paths in
  // the clone are rewritten to lead to the same files from the new place. The covers that
  // are files (`Artwork`) are copied too; the stems and overview data are not. Playback
  // goes on undisturbed, and track and playlist ids stay the same, but the tracks' `path`
  // changes (list the tracks again to see it). If anything fails nothing is left behind and
  // the library keeps its old location.
  // Errors: FAILED_PRECONDITION if no library is open, INVALID_ARGUMENT if `path` is the
  // library's current location, ALREADY_EXISTS if there already is a library at `path`,
  // INTERNAL if copying fails.
  rpc SaveLibraryAs(SaveLibraryAsRequest) returns (SaveLibraryAsResponse);
  // What would change in the source (the library at its location, as opposed to the
  // working copy the backend reads and could change) if the working copy were written to
  // it: the differences between the two. Nothing is changed.
  // Error: FAILED_PRECONDITION if no library is open.
  rpc GetSyncDiff(GetSyncDiffRequest) returns (GetSyncDiffResponse);
  // Writes the working copy's databases to the source, replacing the ones there. The
  // previous ones are first copied to `Database2/open-engine-lib-backup` in the source
  // (replacing an older backup), each file is replaced in one step, and if one fails the
  // ones already replaced are put back.
  // Errors: FAILED_PRECONDITION if no library is open, the source can't be reached (a
  // drive that is gone), is in use (a journal that has not been committed), or has been
  // changed by someone else since the working copy was made and
  // `overwrite_outside_changes` is not set; INTERNAL if writing fails.
  rpc SyncToSource(SyncToSourceRequest) returns (SyncToSourceResponse);
  // Closes the library and stops playback. Succeeds if none is open.
  rpc CloseLibrary(CloseLibraryRequest) returns (CloseLibraryResponse);
  // Streams every track of the open library in id order, in batches.
  // Error: FAILED_PRECONDITION if no library is open.
  rpc ListTracks(ListTracksRequest) returns (stream TrackBatch);
  // All playlists, depth first in display order, each with its tracks.
  // Error: FAILED_PRECONDITION if no library is open.
  rpc ListPlaylists(ListPlaylistsRequest) returns (ListPlaylistsResponse);
  // The cover image with the given `Track.album_art_id`.
  // Errors: FAILED_PRECONDITION if no library is open, NOT_FOUND if the id is unknown
  // or its image is not available on this machine (e.g. covers of streaming tracks).
  rpc GetAlbumArt(GetAlbumArtRequest) returns (GetAlbumArtResponse);
  // The waveform of a track, for drawing it, and its beatgrid if the library has one.
  // The waveform is computed from the audio file, so this takes a moment the first
  // time for a track (the backend remembers recent ones).
  // Errors: FAILED_PRECONDITION if no library is open or the track is a streaming
  // track, INVALID_ARGUMENT for an unknown track id, NOT_FOUND if the audio file does
  // not exist, INTERNAL if it can't be decoded.
  rpc GetWaveform(GetWaveformRequest) returns (GetWaveformResponse);
}

message OpenLibraryRequest {
  // The `Engine Library` folder, the drive or folder that contains it, or its
  // `Database2` folder.
  string path = 1;
}

message OpenLibraryResponse {
  // The `Engine Library` folder that was actually opened.
  string path = 1;
  uint32 track_count = 2;
  uint32 playlist_count = 3;
  // The backend's cached copy of the databases, which is what it reads.
  string cache_path = 4;
}

message SaveLibraryAsRequest {
  // The folder to save into, or the `Engine Library` folder to make.
  string path = 1;
}

message SaveLibraryAsResponse {
  // The `Engine Library` folder that was made, the library's location now.
  string path = 1;
  // The backend's cached copy of the databases, which is what it reads now.
  string cache_path = 2;
}

message CloseLibraryRequest {}
message CloseLibraryResponse {}

message ListTracksRequest {}

message TrackBatch {
  repeated Track tracks = 1;
}

message Track {
  // Identifies the track while this library is open. Ids are not stable across
  // opens and say nothing about the Engine database's own ids.
  uint32 id = 1;
  string title = 2;
  string artist = 3;
  string album = 4;
  string genre = 5;
  // Analysed tempo, unset if unknown.
  optional double bpm = 6;
  optional uint32 length_seconds = 7;
  // Streaming tracks (e.g. TIDAL) have no file on this machine and can't be played.
  bool streaming = 8;
  // Which cover the track has, for GetAlbumArt. Tracks that share a cover (an album)
  // share the id. Unset if the track has none. The image may still turn out not to be
  // available, see GetAlbumArt.
  optional uint32 album_art_id = 9;
  // The track's star rating from 0 to 100, 20 per star (so 60 is three stars). Other
  // values are possible: libraries that were imported can have any.
  optional uint32 rating = 11;
  // What SoundSwitch (the lighting software, which keeps projects in the drive's
  // `SoundSwitch` folder) has for the track. Not set if there is no SoundSwitch data for
  // the drive or the track is not in it.
  SoundSwitchState soundswitch = 12;
  // The SoundSwitch projects that have lighting for the track, when it is rendered.
  repeated string soundswitch_projects = 13;
  // The audio file as the library records it, relative to the `Engine Library`
  // folder. Unlike `id`, it stays the same across opens, so it identifies the track
  // between sessions (the library keeps it unique).
  string path = 10;
}

enum SoundSwitchState {
  // Not in SoundSwitch, or there is no SoundSwitch data to tell.
  SOUND_SWITCH_STATE_UNSPECIFIED = 0;
  // SoundSwitch analysed the track but has no lighting for it.
  SOUND_SWITCH_STATE_ANALYSED = 1;
  // Lighting was rendered for the track.
  SOUND_SWITCH_STATE_RENDERED = 2;
}

message GetAlbumArtRequest {
  uint32 id = 1;
}

message GetAlbumArtResponse {
  // The encoded image file.
  bytes data = 1;
  // `image/png` or `image/jpeg`.
  string mime_type = 2;
}

message ListPlaylistsRequest {}

message ListPlaylistsResponse {
  repeated Playlist playlists = 1;
}

message Playlist {
  // Identifies the playlist while this library is open.
  uint32 id = 1;
  string title = 2;
  // 0 for top-level playlists.
  uint32 depth = 3;
  optional uint32 parent_id = 4;
  // True for folders; they can hold tracks too.
  bool has_children = 5;
  // Track ids in playlist order.
  repeated uint32 track_ids = 6;
}

message GetWaveformRequest {
  uint32 track_id = 1;
  // Where the low, mid and high bands meet, in Hz: the low band is below `low_mid_hz`,
  // the high band above `mid_high_hz`, the mid band in between. Unset means 600 Hz and
  // 4000 Hz. Both must be between 20 and 20000 and the first below the second, else
  // INVALID_ARGUMENT. (A file with a low sample rate can't hold the high ones; they are
  // lowered for it.)
  optional uint32 low_mid_hz = 2;
  optional uint32 mid_high_hz = 3;
  // How much each band is amplified before it is drawn, see `GetWaveformResponse.columns`.
  // Unset means 1. Each must be above 0 and at most 20, else INVALID_ARGUMENT.
  optional float gain_low = 4;
  optional float gain_mid = 5;
  optional float gain_high = 6;
}

message GetWaveformResponse {
  double duration_seconds = 1;
  // How many columns make up a second of the track (100: one per 10 ms).
  uint32 columns_per_second = 2;
  // Three bytes per column, in time order: the height to draw the low, the mid and the
  // high frequencies at, from 0 (nothing) to 255 (full height). A band's height is its
  // loudest sample in the 10 ms (as a share of full scale: a full-scale sine wave in the
  // band is 1) times the gain of the band, but at most 1, to the power of 0.8, times
  // 255. The scale is fixed, the same for every track: it is not fitted to how loud the
  // track is or to how much of each band it has.
  bytes columns = 3;
  // Unset if the library has no beatgrid for the track.
  optional BeatGrid beat_grid = 4;
}

// The library's analysis of where the beats are. Between two markers the beats are
// evenly spaced; before the first and after the last they continue at the spacing of
// the nearest pair.
message BeatGrid {
  // At least two, in time order.
  repeated BeatMarker markers = 1;
}

message BeatMarker {
  // May be negative: the grid can start before the track does.
  double position_seconds = 1;
  // Counts beats, and can be negative. A beat whose number is a multiple of 4 starts a bar.
  int64 beat_number = 2;
}

message GetSyncDiffRequest {}

// What syncing would do to the source. "Added" is in the working copy and not in the
// source, so syncing adds it there; "removed" is in the source and not in the working
// copy, so syncing removes it from the source. Lists are cut at 200 entries, the counts
// are complete.
message GetSyncDiffResponse {
  string source_path = 1;
  string cache_path = 2;
  // False if the source can't be reached (say its drive is not connected); then nothing
  // else is filled in.
  bool source_available = 3;
  // The source has an uncommitted journal: another program is writing to it right now.
  bool source_busy = 4;
  // The source's databases were changed by someone else after the working copy was made
  // from them, so syncing would also undo their changes.
  bool source_changed_outside = 5;
  // The database files (`m.db`, `hm.db`, ...) whose content differs. Syncing writes
  // exactly these. They can differ in ways that are not itemised below (the history,
  // smart playlists, ...).
  repeated string changed_databases = 6;
  uint32 tracks_added = 7;
  uint32 tracks_removed = 8;
  uint32 tracks_changed = 9;
  repeated TrackRef added_tracks = 10;
  repeated TrackRef removed_tracks = 11;
  repeated TrackChange changed_tracks = 12;
  uint32 playlists_changed = 13;
  repeated PlaylistChange changed_playlists = 14;
}

message TrackRef {
  string title = 1;
  string artist = 2;
  string path = 3;
}

message TrackChange {
  TrackRef track = 1;
  repeated FieldChange fields = 2;
}

message FieldChange {
  string field = 1;
  // The value in the source, and what it would become. Empty for none; binary data
  // (beatgrid, cues, loops) is shown as "(changed)".
  string source_value = 2;
  string working_value = 3;
}

message PlaylistChange {
  // The playlist as a path of titles, e.g. "House / Deep".
  string name = 1;
  PlaylistChangeKind kind = 2;
  // For a rename, the old name; for a move, the old parent.
  string detail = 3;
  uint32 tracks_added = 4;
  uint32 tracks_removed = 5;
  bool order_changed = 6;
}

enum PlaylistChangeKind {
  PLAYLIST_CHANGE_KIND_UNSPECIFIED = 0;
  PLAYLIST_CHANGE_KIND_ADDED = 1;
  PLAYLIST_CHANGE_KIND_REMOVED = 2;
  PLAYLIST_CHANGE_KIND_RENAMED = 3;
  PLAYLIST_CHANGE_KIND_MOVED = 4;
  // Only its tracks changed.
  PLAYLIST_CHANGE_KIND_TRACKS = 5;
}

message SyncToSourceRequest {
  // Go ahead although the source was changed by someone else since the working copy was
  // made, undoing those changes.
  bool overwrite_outside_changes = 1;
}

message SyncToSourceResponse {
  uint32 files_written = 1;
  // Where the databases that were replaced were kept.
  string backup_path = 2;
}
