// How the library process (`open-engine-backend`) uses the audio process
// (`open-engine-audio`), which it starts. The UI never talks to the audio process: it
// plays tracks and asks for waveforms through `PlaybackService` and
// `LibraryService.GetWaveform` of the library process, which looks up the files and
// passes them on here. The audio process knows nothing about libraries.
syntax = "proto3";

package openenginelib.v1;

import "openenginelib/v1/controller.proto";
import "openenginelib/v1/playback.proto";

service AudioService {
  // Replaces the queue and starts the track at `position`.
  // Errors: INVALID_ARGUMENT for a position outside the queue. A track that can't be
  // played is not an RPC error: it is reported in the returned status.
  rpc Play(AudioPlayRequest) returns (PlaybackStatus);
  // The rest is as in `PlaybackService`.
  rpc TogglePause(TogglePauseRequest) returns (PlaybackStatus);
  rpc Stop(StopRequest) returns (PlaybackStatus);
  rpc Next(NextRequest) returns (PlaybackStatus);
  rpc Previous(PreviousRequest) returns (PlaybackStatus);
  rpc Seek(SeekRequest) returns (PlaybackStatus);
  rpc GetStatus(GetStatusRequest) returns (PlaybackStatus);
  rpc BeginScratch(BeginScratchRequest) returns (PlaybackStatus);
  rpc MoveScratch(MoveScratchRequest) returns (PlaybackStatus);
  rpc EndScratch(EndScratchRequest) returns (PlaybackStatus);
  // Stops playback, empties the queue and releases the audio device (which the next Play
  // opens again), for when the library that the queue came from is closed.
  rpc Close(CloseRequest) returns (PlaybackStatus);
  // The waveform of an audio file, for drawing it. It is computed from the file, so this
  // takes a moment the first time (the process remembers recent ones).
  // Errors: INVALID_ARGUMENT for split points or gains out of range, NOT_FOUND if there is
  // no file at `path` or at `fallback_path`, INTERNAL if it can't be decoded.
  rpc AnalyzeWaveform(AnalyzeWaveformRequest) returns (AnalyzeWaveformResponse);
  // The messages of the MIDI controllers that are connected, and which ones are, until the
  // call is dropped (which is also when the process stops listening). The audio process
  // only reports what the hardware sends; what it means is for the library process to say.
  rpc WatchMidi(WatchMidiRequest) returns (stream MidiEvent);
  // Analyses an audio file: its beats and downbeats (Beat This!) and its key (libKeyFinder).
  // Streams how far it is, then the result as the last message. The weights of Beat This!
  // are files that have to be installed (see docs/architecture.md).
  // Errors: NOT_FOUND if there is no file at `path` or at `fallback_path`,
  // FAILED_PRECONDITION if the models are not installed (the message lists where they are
  // looked for) or this build has no analysis, INTERNAL if it can't be decoded or analysed.
  rpc AnalyzeTrack(AudioAnalyzeTrackRequest) returns (stream AudioAnalyzeTrackEvent);
}

message AudioAnalyzeTrackRequest {
  string path = 1;
  // As in `QueueEntry`.
  string fallback_path = 2;
}

message AudioAnalyzeTrackEvent {
  oneof event {
    AudioAnalysisProgress progress = 1;
    AudioFound found = 2;
  }
}

enum AudioAnalysisStage {
  AUDIO_ANALYSIS_STAGE_UNSPECIFIED = 0;
  AUDIO_ANALYSIS_STAGE_DECODING = 1;
  AUDIO_ANALYSIS_STAGE_BEATS = 2;
  AUDIO_ANALYSIS_STAGE_KEY = 3;
}

message AudioAnalysisProgress {
  AudioAnalysisStage stage = 1;
  // How far the whole analysis is, 0 to 1. Only goes up.
  float fraction = 2;
}

// What the analysis found.
message AudioFound {
  // The time of every beat, in seconds.
  repeated double beats = 1;
  // The time of the beats that start a bar.
  repeated double downbeats = 2;
  // The file's sample rate and how many samples (per channel) it has.
  uint32 sample_rate = 3;
  uint64 frames = 4;
  // libKeyFinder's key, 0 to 23: pairs of major and minor by the semitone from A (0 A
  // major, 1 A minor, 2 B-flat major, 3 B-flat minor, ... 22 A-flat major, 23 A-flat
  // minor). Not set if it heard none (silence).
  optional uint32 key = 5;
  // The overview waveform: 1025 entries of three bytes (low, mid, high), the first 1024 for
  // equal stretches of the track and the last the largest of each band, as Engine keeps it.
  // Not set if the file could not be measured.
  optional bytes overview = 6;
}

message WatchMidiRequest {}

message MidiEvent {
  oneof event {
    ControllerInput input = 1;
    // Sent first, and again when a controller is plugged in or pulled out.
    MidiDevices devices = 2;
    // MIDI can't be used at all (the sequencer can't be opened, or this system has none), and
    // why. The stream ends after it.
    string unavailable = 3;
  }
}

message MidiDevices {
  // The names of the controllers that are connected.
  repeated string names = 1;
}

message AudioPlayRequest {
  repeated QueueEntry queue = 1;
  uint32 position = 2;
  // Load the track without playing it: it starts out paused (and silent).
  bool start_paused = 3;
  // Where in the track to start, in milliseconds. Formats that can't seek start at 0.
  uint64 start_position_ms = 4;
}

message QueueEntry {
  // The library's track id: only handed back in the status.
  uint32 track_id = 1;
  // The audio file.
  string path = 2;
  // Where else the file may be (the track's saved origin): played if there is no file at
  // `path`. If there is none at either, the error is about `path`. Empty for none.
  string fallback_path = 3;
  // A streaming track, which has no file: it is skipped and reported as an error.
  bool streaming = 4;
}

message CloseRequest {}

message AnalyzeWaveformRequest {
  // The audio file, and where else it may be (a track's saved origin; empty for none): it is
  // read from `fallback_path` if there is no file at `path`.
  string path = 1;
  string fallback_path = 2;
  // Where the low, mid and high bands meet, in Hz, and how much each band is amplified, as
  // in `GetWaveformRequest`.
  optional uint32 low_mid_hz = 3;
  optional uint32 mid_high_hz = 4;
  optional float gain_low = 5;
  optional float gain_mid = 6;
  optional float gain_high = 7;
}

message AnalyzeWaveformResponse {
  double duration_seconds = 1;
  // How many columns make up a second of the track (100: one per 10 ms).
  uint32 columns_per_second = 2;
  // Three bytes per column, as in `GetWaveformResponse.columns`.
  bytes columns = 3;
}
