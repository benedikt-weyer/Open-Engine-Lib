// Playing tracks of the open library. The backend owns the queue and moves on
// to the next track by itself, so the UI only has to poll GetStatus.
syntax = "proto3";

package openenginelib.v1;

service PlaybackService {
  // Replaces the queue and starts the track at `position`.
  // Errors: FAILED_PRECONDITION if no library is open, INVALID_ARGUMENT for an
  // unknown track id or a position outside the queue. A track that can't be
  // played is not an RPC error: it is reported in the returned status.
  rpc Play(PlayRequest) returns (PlaybackStatus);
  // Pauses, or resumes if paused. Does nothing while stopped.
  rpc TogglePause(TogglePauseRequest) returns (PlaybackStatus);
  // Stops playback and empties the queue.
  rpc Stop(StopRequest) returns (PlaybackStatus);
  // Starts the next track of the queue. Does nothing at its end.
  rpc Next(NextRequest) returns (PlaybackStatus);
  // Starts the previous track of the queue, or restarts the first one.
  rpc Previous(PreviousRequest) returns (PlaybackStatus);
  // Jumps within the current track. Formats that can't seek ignore it.
  rpc Seek(SeekRequest) returns (PlaybackStatus);
  rpc GetStatus(GetStatusRequest) returns (PlaybackStatus);
  // Scratching, like a hand on a record: holds the track where it is (it is silent and
  // reported as paused, with `scratching` set) until EndScratch, and MoveScratch drags it
  // forwards or backwards, which is heard at the speed of the movement. Only a stretch of
  // the track around the place where it was held can be scratched (about 15 seconds either
  // way). EndScratch resumes playing from where the track was left if it was playing when
  // the scratch began. Does nothing while stopped; starting another track ends it.
  rpc BeginScratch(BeginScratchRequest) returns (PlaybackStatus);
  rpc MoveScratch(MoveScratchRequest) returns (PlaybackStatus);
  rpc EndScratch(EndScratchRequest) returns (PlaybackStatus);
}

message PlayRequest {
  repeated uint32 track_ids = 1;
  uint32 position = 2;
  // Load the track without playing it: it starts out paused (and silent), ready to be
  // resumed with TogglePause.
  bool start_paused = 3;
  // Where in the track to start, in milliseconds. Formats that can't seek start at 0.
  uint64 start_position_ms = 4;
}

message TogglePauseRequest {}
message StopRequest {}
message NextRequest {}
message PreviousRequest {}

message SeekRequest {
  uint64 position_ms = 1;
}

message GetStatusRequest {}

message BeginScratchRequest {}

message MoveScratchRequest {
  // How far to move the track, in seconds: negative is backwards. Ignored unless a scratch
  // is going on.
  double delta_seconds = 1;
}

message EndScratchRequest {}

message PlaybackStatus {
  PlaybackState state = 1;
  // Index into the queue and the id of the track being played. Unset while stopped.
  optional uint32 queue_position = 2;
  optional uint32 track_id = 3;
  uint64 position_ms = 4;
  // The last track that failed to play since playback was last started. Cleared
  // by the next Play.
  optional PlaybackError error = 5;
  // The track is being scratched: `position_ms` is where the hand is, and the state is
  // paused whatever it was before.
  bool scratching = 6;
}

enum PlaybackState {
  PLAYBACK_STATE_UNSPECIFIED = 0;
  PLAYBACK_STATE_STOPPED = 1;
  PLAYBACK_STATE_PLAYING = 2;
  PLAYBACK_STATE_PAUSED = 3;
}

message PlaybackError {
  PlaybackErrorKind kind = 1;
  uint32 track_id = 2;
  // Human readable details, e.g. the missing path or the decoder's message.
  string detail = 3;
}

enum PlaybackErrorKind {
  PLAYBACK_ERROR_KIND_UNSPECIFIED = 0;
  // The track's file does not exist.
  PLAYBACK_ERROR_KIND_NOT_FOUND = 1;
  // A streaming track, which has no file.
  PLAYBACK_ERROR_KIND_STREAMING = 2;
  // The file or the audio device could not be opened.
  PLAYBACK_ERROR_KIND_FAILED = 3;
}
